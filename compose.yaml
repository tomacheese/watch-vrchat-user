services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - VRCHAT_USERNAME=${VRCHAT_USERNAME}
      - VRCHAT_PASSWORD=${VRCHAT_PASSWORD}
      - VRCHAT_TOTP_SECRET=${VRCHAT_TOTP_SECRET:-}
      # config.yaml の ${...} 展開に使う Webhook URL (config.yaml で参照する変数をここに追加する)
      - DISCORD_WEBHOOK_MAIN=${DISCORD_WEBHOOK_MAIN:-}
      - DISCORD_WEBHOOK_DANCE=${DISCORD_WEBHOOK_DANCE:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - HEALTH_PORT=${HEALTH_PORT:-3000}
      - HEALTH_HOST=${HEALTH_HOST:-127.0.0.1}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://$${HEALTH_HOST:-127.0.0.1}:$${HEALTH_PORT:-3000}/health || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
